name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  UV_VERSION: "0.12.3"

jobs:
  unit-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==${{ env.UV_VERSION }}
      - name: Sync locked runtime dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Verify lock and environment
        run: |
          uv lock --check
          uv pip check
      - name: Run unit tests
        run: uv run --frozen --no-sync python -m unittest discover -s tests -t . -v

  quality-gates:
    name: Ruff, mypy, coverage, full performance, soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==${{ env.UV_VERSION }}
      - name: Sync locked quality dependencies
        run: uv sync --frozen --extra quality --python 3.11
      - name: Ruff static analysis
        run: uv run --frozen --no-sync ruff check .
      - name: Numerical core type check
        run: uv run --frozen --no-sync mypy
      - name: Numerical core branch coverage
        run: |
          uv run --frozen --no-sync coverage run -m unittest \
            tests.test_beamforming tests.test_directivity \
            tests.test_simulation tests.test_resource_policy
          uv run --frozen --no-sync coverage report
      - name: 64x64 directivity performance regression
        run: uv run --frozen --no-sync python benchmarks/check_performance_regression.py
      - name: Full workload performance regression
        run: uv run --frozen --no-sync python benchmarks/check_full_performance_regression.py
      - name: Multi-session Process Pool soak smoke test
        run: >-
          uv run --frozen --no-sync python benchmarks/soak_multi_session.py
          --sessions 4 --iterations 2 --backend process --workers 2
          --memory-budget-mib 256

  ops-integration:
    name: Redis coordination and Process Pool integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==${{ env.UV_VERSION }}
      - name: Sync locked operations dependencies
        run: uv sync --frozen --extra ops --python 3.11
      - name: Verify Prometheus and OTLP metric APIs
        run: |
          uv run --frozen --no-sync python -m unittest tests.test_observability -v
          uv run --frozen --no-sync python -c "from opentelemetry.exporter.otlp.proto.http.metric_exporter import OTLPMetricExporter; from opentelemetry.sdk.metrics.export import PeriodicExportingMetricReader"
      - name: Verify Redis cross-replica coordination
        env:
          DBF_REDIS_URL: redis://127.0.0.1:6379/15
          RUN_REDIS_INTEGRATION: "1"
        run: >-
          uv run --frozen --no-sync python -m unittest
          tests.integration.test_redis_coordination -v
      - name: Verify spawned Process Pool worker
        env:
          RUN_PROCESS_POOL_INTEGRATION: "1"
        run: >-
          uv run --frozen --no-sync python -m unittest
          tests.test_compute_tasks.ComputeTaskTests.test_process_executor_runs_in_spawned_worker
          -v

  dependency-health:
    name: Locked dependency health
    uses: ./.github/workflows/dependency-health.yml

  browser-storage-e2e:
    name: Browser localStorage E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==${{ env.UV_VERSION }}
      - name: Sync locked E2E dependencies
        run: uv sync --frozen --extra e2e --python 3.11
      - name: Install Chromium
        run: uv run --frozen --no-sync python -m playwright install --with-deps chromium
      - name: Run browser test
        env:
          RUN_E2E: "1"
        run: uv run --frozen --no-sync python -m unittest discover -s tests/e2e -t . -v
