name: Dependency health

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 17 * * 1"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  UV_VERSION: "0.12.3"

jobs:
  audit:
    name: Lock, vulnerability, and license audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==${{ env.UV_VERSION }}
      - name: Sync every locked dependency group
        run: uv sync --frozen --all-extras --python 3.11
      - name: Verify lock and installed requirements
        run: |
          uv lock --check
          uv run --frozen --no-sync python -m pip check
      - name: Audit known vulnerabilities
        run: >-
          uv run --frozen --no-sync python -m pip_audit
          --local --strict --progress-spinner off
      - name: Report and enforce license policy
        run: >-
          uv run --frozen --no-sync python -m piplicenses
          --format=markdown --with-authors --with-urls
          --fail-on "GPL;AGPL;UNKNOWN" --partial-match
