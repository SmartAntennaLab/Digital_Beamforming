[project]
name = "digital-beamforming-simulator"
version = "1.5.0"
description = "Interactive Streamlit simulator for digital beamforming arrays"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
    "plotly==6.9.0",
    "psutil==7.2.2",
    "streamlit==1.60.0",
]

[project.optional-dependencies]
dev = [
    "pip==26.2",
    "pip-audit==2.10.1",
    "pip-licenses==5.5.5",
    "setuptools==83.0.0",
]
e2e = [
    "playwright==1.61.0",
]

[tool.uv]
package = false
