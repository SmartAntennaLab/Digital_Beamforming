[project]
name = "digital-beamforming-simulator"
version = "1.5.0"
description = "Interactive Streamlit simulator for digital beamforming arrays"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.5",
    "plotly==6.9.0",
    "psutil==7.2.2",
    "streamlit==1.61.1",
]

[project.optional-dependencies]
dev = [
    "pip==26.2.1",
    "pip-audit==2.10.1",
    "pip-licenses==5.5.5",
    "setuptools==83.0.0",
]
e2e = [
    "playwright==1.62.0",
]
quality = [
    "coverage==7.15.4",
    "mypy==2.3.0",
    "ruff==0.16.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Stable option/sampling APIs intentionally re-export split implementations.
"device_settings.py" = ["F401"]
"simulation.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
files = [
    "array_geometry.py",
    "array_math.py",
    "beamforming.py",
    "directivity.py",
    "null_solver.py",
    "pattern_metrics.py",
    "pattern_sampling.py",
    "resource_policy.py",
    "simulation.py",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "benchmarks/*",
    "tests/*",
    "main.py",
    "compute_governor.py",
    "device_settings.py",
    "device_storage.py",
    "directivity_controls.py",
    "exporters.py",
    "model_options.py",
    "scan_controls.py",
    "settings_panel.py",
    "settings_storage.py",
    "simulation_cache.py",
    "ui_*.py",
]

[tool.coverage.report]
fail_under = 80
precision = 1
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
